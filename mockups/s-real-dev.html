<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실물 리모컨 — 디벨롭 (TV 모달)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css">
<style>
  :root{ --navytx:#23306a; --orange:#e8853a; }
  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{ margin:0; padding:0; background:#0f0e14; font-family:'Gothic A1',sans-serif; color:#fff; }
  body{ padding:36px 24px 70px; display:flex; flex-direction:column; align-items:center; }
  .seg7{ font-family:'DSEG7-Classic','IBM Plex Mono',monospace; }
  .ttl{ text-align:center; font-family:'Black Han Sans'; font-size:20px; margin:0 0 4px; }
  .sub{ text-align:center; color:rgba(255,255,255,0.45); font-size:12px; margin:0 0 24px; }

  .phone{ width:340px; height:710px; background:#000; border-radius:50px; padding:11px; position:relative; box-shadow:0 30px 80px rgba(0,0,0,0.7); }
  .screen{ width:100%; height:100%; border-radius:40px; overflow:hidden; position:relative; }
  .island{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:100px; height:30px; background:#000; border-radius:18px; z-index:300; }

  /* ===== 뒤: 빈 노래방 TV (대기 화면) ===== */
  .tv{ position:absolute; inset:0; background:radial-gradient(130% 80% at 50% 20%, #1c2444 0%, #0a0d18 62%, #05070f 100%); }
  .tv .scan{ position:absolute; inset:0; background:repeating-linear-gradient(rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); mix-blend-mode:screen; }
  .tv .vig{ position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(0,0,0,0.7); }
  /* 상단 대기 영역 (모달 위로 보이는 부분) */
  .tvtop{ position:absolute; left:0; right:0; top:0; height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2; padding-top:30px; }
  .tvtop .mic{ font-size:24px; opacity:0.5; margin-bottom:8px; filter:grayscale(0.3); }
  .tvtop .wait{ font-family:'Black Han Sans'; font-size:18px; color:rgba(173,196,255,0.85); letter-spacing:1px; text-shadow:0 0 14px rgba(90,130,255,0.4); }
  .tvtop .wait .dim{ color:rgba(173,196,255,0.4); }
  .tvtop .hint{ margin-top:7px; font-size:11px; color:rgba(255,255,255,0.32); letter-spacing:0.5px; }
  .tvtop .eq{ display:flex; gap:4px; align-items:flex-end; height:16px; margin-top:12px; }
  .tvtop .eq span{ width:4px; background:rgba(120,150,255,0.5); border-radius:2px; animation:bob 1.3s ease-in-out infinite; }
  .tvtop .eq span:nth-child(1){ height:6px; animation-delay:0s } .tvtop .eq span:nth-child(2){ height:11px; animation-delay:.15s }
  .tvtop .eq span:nth-child(3){ height:16px; animation-delay:.3s } .tvtop .eq span:nth-child(4){ height:9px; animation-delay:.45s }
  .tvtop .eq span:nth-child(5){ height:13px; animation-delay:.6s } .tvtop .eq span:nth-child(6){ height:7px; animation-delay:.75s }
  @keyframes bob{ 50%{ transform:scaleY(0.4); opacity:0.5 } }

  /* ===== 앞: 리모컨 모달 (하단 시트) ===== */
  .remote{ position:absolute; left:0; right:0; bottom:0; z-index:10; height:438px;
    border-radius:30px 30px 40px 40px; padding:14px 12px 14px;
    background:linear-gradient(150deg,#f1ead7 0%,#e4dabe 45%,#d2c7a6 80%,#c2b692 100%);
    border:2.5px solid rgba(168,206,232,0.7);
    box-shadow:0 -12px 40px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(206,230,246,0.55), inset 0 1px 0 rgba(255,255,255,0.5); }
  .grab{ width:42px; height:5px; border-radius:3px; background:rgba(60,50,30,0.28); margin:0 auto 10px; }
  .deck{ position:relative; z-index:2; height:calc(100% - 15px); display:flex; flex-direction:column; gap:9px; }

  .head{ display:flex; align-items:center; padding:0 4px; }
  .brand{ display:flex; align-items:center; gap:6px; }
  .brand .badge{ width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ff8a5c,#e8533a); display:flex; align-items:center; justify-content:center; font-family:'Black Han Sans'; font-size:11px; color:#fff; }
  .brand .nm{ font-family:'Black Han Sans'; font-size:17px; color:#333; }

  .lcd{ position:relative; overflow:hidden; background:radial-gradient(120% 110% at 50% 40%, #14120b, #050503); border:2px solid #2c281c; border-radius:7px; padding:8px 12px; box-shadow:inset 0 2px 12px rgba(0,0,0,0.9); }
  .vfd{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .vfd .col2{ display:flex; flex-direction:column; gap:3px; }
  .vfd .blk{ width:12px; height:5px; border-radius:1px; background:rgba(93,255,143,0.16); }
  .vfd .blk.g{ background:#4ee87f; box-shadow:0 0 5px rgba(78,232,127,0.85); }
  .vfd .blk.r{ background:#ff4d3a; box-shadow:0 0 6px rgba(255,77,58,0.9); }
  .vfd .center{ position:relative; text-align:center; flex:1; }
  .vfd .digits{ position:relative; display:inline-block; line-height:1; }
  .vfd .ghost{ position:absolute; left:0; top:0; font-family:'DSEG7-Classic'; font-weight:bold; font-size:44px; color:rgba(255,100,60,0.10); letter-spacing:2px; }
  .vfd .val{ position:relative; font-family:'DSEG7-Classic'; font-weight:bold; font-size:44px; color:#ff5a32; letter-spacing:2px; text-shadow:0 0 9px rgba(255,90,50,0.9), 0 0 20px rgba(255,90,50,0.45); }
  .vfd .val .cln{ animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0.2; } }
  .lcd::after{ content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(160deg, rgba(255,255,255,0.08), transparent 42%); }

  /* split: 좌 기능 매트릭스 + 우 숫자패드 */
  .split{ display:flex; gap:8px; }
  .split .left{ flex:1.05; display:flex; flex-direction:column; gap:6px; }
  .split .right{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:5px; align-content:start; }
  .matrix{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  /* 좌측 6개 버튼: 작게 */
  .mk{ display:flex; align-items:center; justify-content:center; padding:9px 2px; border-radius:8px; font-family:'Gothic A1'; font-weight:900; font-size:13px; border:1px solid rgba(0,0,0,0.2); }
  /* 모드 키: 검정 글씨 */
  .mk.lt{ background:linear-gradient(180deg,#f4eedd,#e6dcc3); color:#1a1a1a; box-shadow:0 2px 0 #bcb091; }
  .mk.lt.on{ outline:2px solid #d23522; outline-offset:1px; }
  .mk.lt.on .dot{ width:6px; height:6px; border-radius:50%; background:var(--orange); margin-right:4px; }
  .mk.yel{ background:linear-gradient(180deg,#f1d34e,#e0bb2c); color:#3a2e00; box-shadow:0 2px 0 #b8961e; }
  .mk.gr{ background:linear-gradient(180deg,#74c94f,#54a836); color:#0b2606; box-shadow:0 2px 0 #3a7720; }
  .mk.ind{ background:linear-gradient(180deg,#7d6fe8,#5b54d6); color:#fff; box-shadow:0 2px 0 #3d37a0; }

  .nkey{ height:46px; border-radius:8px; background:linear-gradient(180deg,#eceee0,#d6d9c4); color:#1a1a1a; border:1px solid #c1c4b0; box-shadow:0 3px 0 #b1b49f, inset 0 1px 0 #ffffff, 0 0 8px rgba(196,228,150,0.28); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2','Gothic A1',sans-serif; font-weight:800; font-style:italic; font-size:34px; line-height:1; }
  .nkey.cancel,.nkey.del{ background:linear-gradient(180deg,#5a93d6,#3f73bd); color:#fff; border-color:#2f5a9a; box-shadow:0 3px 0 #294f88; font-style:normal; font-weight:800; font-size:14px; letter-spacing:-0.5px; }
  .nkey.del{ font-size:16px; }

  /* 잠글앱관리: 좌측 컬럼, 2줄 빨간 블록 */
  .manage{ flex:1; border-radius:10px; background:linear-gradient(180deg,#ec5743,#d23522); color:#fff; border:1px solid #a8281a; box-shadow:0 3px 0 #951f12; display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 4px; font-family:'Gothic A1'; font-weight:900; font-size:15px; line-height:1.25; letter-spacing:0.2px; }

  /* 시작 (예약 제거) — 비닐 막 위로 올려 또렷한 아날로그 버튼 */
  .start{ position:relative; z-index:70; margin-top:auto; height:60px; border-radius:30px; background:linear-gradient(180deg,#f7ff5e,#e9f600); color:#2a2e06; border:1px solid #c8d400;
    box-shadow:0 4px 0 #b5bf00; display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans'; font-size:31px; letter-spacing:12px; text-shadow:0 1px 0 rgba(255,255,255,0.4); }

  /* 비닐 막 — 리모컨 모달에만 */
  .film{ position:absolute; inset:0; z-index:60; pointer-events:none; border-radius:30px 30px 40px 40px; overflow:hidden; }
  .film .tint{ position:absolute; inset:0; background:rgba(150,195,225,0.06); }
  .film .topglow{ position:absolute; inset:0; background:radial-gradient(70% 22% at 38% 4%, rgba(255,255,255,0.14), transparent 60%); }
  .film .st{ position:absolute; background:linear-gradient(100deg, transparent, rgba(255,255,255,0.6), transparent); filter:blur(1.2px); border-radius:6px; opacity:0.5; }
  .film .s1{ left:-10%; right:30%; top:40%; height:13px; transform:rotate(-9deg) skewX(-24deg); }
  .film .s2{ left:14%; right:-10%; top:62%; height:15px; transform:rotate(7deg) skewX(28deg); }
  /* 숫자패드(우측)에 비닐 질감 더 강하게 — 부드러운 광막 + 잔주름 */
  .film .pad{ position:absolute; right:3%; width:46%; top:36%; height:40%; border-radius:10px;
    background:radial-gradient(120% 80% at 70% 20%, rgba(255,255,255,0.16), transparent 70%); }
  .film .s3{ left:52%; right:-6%; top:44%; height:10px; transform:rotate(-13deg) skewX(-30deg); opacity:0.6; }
  .film .s4{ left:55%; right:0%; top:55%; height:8px; transform:rotate(6deg) skewX(34deg); opacity:0.45; }
  .film .s5{ left:50%; right:2%; top:67%; height:11px; transform:rotate(-5deg) skewX(-20deg); opacity:0.5; }
  .film .edge{ position:absolute; inset:4px; border-radius:27px 27px 36px 36px; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.38), inset 0 0 22px rgba(180,215,235,0.2); }
</style>
</head>
<body>

<h1 class="ttl">실물 리모컨 — 디벨롭</h1>
<p class="sub">하단 리모컨 모달 + 위로 빈 노래방 TV가 살짝 (빨리 잠그고 싶게)</p>

<div class="phone"><div class="screen">
  <div class="island"></div>

  <!-- 뒤: 빈 TV 대기화면 -->
  <div class="tv"><div class="scan"></div><div class="vig"></div></div>
  <div class="tvtop">
    <div class="mic">🎤</div>
    <div class="wait">잠금 대기 중<span class="dim"> ·</span></div>
    <div class="hint">▶ 시작을 누르면 화면이 잠겨요</div>
    <div class="eq"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <!-- 앞: 리모컨 모달 -->
  <div class="remote">
    <div class="grab"></div>
    <div class="deck">
      <div class="head"><div class="brand"><div class="badge">TL</div><div class="nm">TODOLOCK</div></div></div>

      <div class="lcd"><div class="vfd">
        <div class="col2"><span class="blk r"></span><span class="blk g"></span><span class="blk g"></span><span class="blk"></span></div>
        <div class="center"><div class="digits"><span class="ghost">88:88</span><span class="val seg7">03<span class="cln">:</span>00</span></div></div>
        <div class="col2"><span class="blk r"></span><span class="blk"></span><span class="blk g"></span><span class="blk g"></span></div>
      </div></div>

      <div class="split">
        <div class="left">
          <div class="matrix">
            <div class="mk yel">시간▲</div>
            <div class="mk yel">시간▼</div>
            <div class="mk lt on"><span class="dot"></span>공부</div>
            <div class="mk lt">출근길</div>
            <div class="mk gr">점프</div>
            <div class="mk ind">감시</div>
          </div>
          <div class="manage">잠글 앱<br>관리 · 4</div>
        </div>
        <div class="right">
          <div class="nkey">1</div><div class="nkey">2</div><div class="nkey">3</div>
          <div class="nkey">4</div><div class="nkey">5</div><div class="nkey">6</div>
          <div class="nkey">7</div><div class="nkey">8</div><div class="nkey">9</div>
          <div class="nkey cancel">취소</div><div class="nkey">0</div><div class="nkey del">지움</div>
        </div>
      </div>

      <div class="start">시 작 ▶</div>
    </div>

    <div class="film">
      <div class="tint"></div><div class="topglow"></div>
      <span class="pad"></span>
      <span class="st s1"></span><span class="st s2"></span>
      <span class="st s3"></span><span class="st s4"></span><span class="st s5"></span>
      <div class="edge"></div>
    </div>
  </div>

</div></div>

</body>
</html>
