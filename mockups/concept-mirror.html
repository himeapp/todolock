<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>concept — 거울 (조용한 버전)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body { margin:0; padding:0; background:#070708; font-family:'Gowun Dodum',sans-serif; color:#fff; }
  body { padding:50px 24px 90px; display:flex; flex-direction:column; align-items:center; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  .page-title{ color:rgba(255,255,255,0.3); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:4px; margin-bottom:44px; }
  .row{ display:flex; gap:48px; flex-wrap:wrap; justify-content:center; }
  .screen-wrap{ display:flex; flex-direction:column; align-items:center; }
  .label{ margin-top:16px; color:rgba(255,255,255,0.35); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; }

  .phone{ width:340px; height:710px; background:#000; border-radius:50px; padding:11px; position:relative; box-shadow:0 30px 80px rgba(0,0,0,0.85); }
  .screen{ width:100%; height:100%; border-radius:40px; overflow:hidden; position:relative; background:#070708; }
  .island{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:100px; height:30px; background:#000; border-radius:18px; z-index:100; }

  .layer{ position:relative; z-index:30; height:100%; padding:64px 26px 0; display:flex; flex-direction:column; }

  /* 무슨 앱 (조용하게, 소문자, 회색) */
  .app{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:rgba(255,255,255,0.35); }

  /* 중앙: 숫자만 */
  .mid{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .mid .small{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:3px; color:rgba(255,255,255,0.4); margin-bottom:18px; }
  .num{ font-family:'IBM Plex Mono',monospace; font-weight:200; font-size:58px; letter-spacing:-1px; color:#f2f2f2; line-height:1; }
  .num.dim{ color:rgba(255,255,255,0.85); }

  /* 하루 게이지 (말 없이, 막대로만) */
  .day{ width:100%; margin-top:40px; }
  .day .ticks{ display:flex; gap:3px; }
  .day .tick{ flex:1; height:30px; border-radius:2px; background:rgba(255,255,255,0.08); }
  .day .tick.spent{ background:rgba(255,255,255,0.55); }
  .day .tick.now{ background:#e0683c; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  .day .legend{ display:flex; justify-content:space-between; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; color:rgba(255,255,255,0.35); }

  /* 버튼: 기능만, 멘트 없음 */
  .btns{ margin-bottom:28px; }
  .btn-main{ width:100%; text-align:center; padding:16px 0; border-radius:13px;
    border:1px solid rgba(255,255,255,0.5); color:#fff; font-family:'Gowun Dodum',sans-serif; font-size:15px; }
  .btn-weak{ width:100%; text-align:center; padding:13px 0; margin-top:10px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(255,255,255,0.3); letter-spacing:2px; }

  /* 2번: 들어갔을 때 피드 위에 조용히 깎임 */
  .feed{ flex:1; display:flex; flex-direction:column; gap:10px; margin-top:24px; opacity:0.4; }
  .post{ background:rgba(255,255,255,0.06); border-radius:14px; height:84px; }
  .overlay-num{ position:absolute; left:0; right:0; top:52%; transform:translateY(-50%); z-index:40;
    text-align:center; }
  .overlay-num .n{ font-family:'IBM Plex Mono',monospace; font-weight:200; font-size:64px; color:#fff; letter-spacing:-2px;
    text-shadow:0 0 30px rgba(0,0,0,0.9); }
  .overlay-num .c{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:3px; color:rgba(255,255,255,0.5); margin-top:8px; }
  .vign{ position:absolute; inset:0; z-index:35; border-radius:40px; pointer-events:none;
    background:radial-gradient(70% 50% at 50% 50%, rgba(7,7,8,0.2), rgba(7,7,8,0.92) 75%); }
</style>
</head>
<body>

<div class="page-title">CONCEPT — 거울 · 조용한 버전</div>

<div class="row">

  <!-- ===== 1. 앱 열었을 때: 숫자만 ===== -->
  <div class="screen-wrap">
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="layer">

        <div class="app">instagram</div>

        <div class="mid">
          <div class="small">오늘 여기서</div>
          <div class="num" id="t1">2:14:38</div>

          <div class="day">
            <div class="ticks" id="ticks"></div>
            <div class="legend"><span>오전 7시 기상</span><span>지금</span></div>
          </div>
        </div>

        <div class="btns">
          <div class="btn-main">열기</div>
          <div class="btn-weak">닫기</div>
        </div>

      </div>
    </div></div>
    <div class="label">01 · 열었을 때</div>
  </div>

  <!-- ===== 2. 그래도 들어가면: 피드 위에 숫자 ===== -->
  <div class="screen-wrap">
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="layer" style="padding-top:60px;">
        <div class="app">instagram · 5분 봐주는 중</div>
        <div class="feed">
          <div class="post"></div><div class="post"></div>
          <div class="post"></div><div class="post"></div>
        </div>
      </div>
      <div class="vign"></div>
      <div class="overlay-num">
        <div class="n" id="t2">2:15:02</div>
        <div class="c">오늘 여기서</div>
      </div>
    </div></div>
    <div class="label">02 · 그래도 들어가면</div>
  </div>

</div>

<script>
  // 하루 게이지: 16칸 (기상~지금~취침), 일부 spent
  const ticks = document.getElementById('ticks');
  for (let i=0;i<16;i++){
    const d=document.createElement('div');
    d.className='tick';
    if(i<9) d.classList.add('spent');
    if(i===9) d.classList.add('now');
    ticks.appendChild(d);
  }

  // 숫자 천천히, 조용히 올라감 (설교 없이)
  let total = 2*3600 + 14*60 + 38;
  const t1=document.getElementById('t1'), t2=document.getElementById('t2');
  function fmt(s){ const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
    return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }
  setInterval(()=>{ total++; t1.textContent=fmt(total); t2.textContent=fmt(total+24); }, 1000);
</script>

</body>
</html>
