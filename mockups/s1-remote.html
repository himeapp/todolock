<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>화면1 — 리모컨 (7세그 + 점프투두)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Black+Han+Sans&family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css">
<style>
  :root{ --navy:#1c2a5c; --navytx:#23306a; --blue:#2f6fd0; --green:#5fb842; --yellow:#ecc63f; --orange:#e8853a; --pink:#dd3f8a; --teal:#1fb6c4; --led:#7dff9f; }
  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{ margin:0; padding:0; background:#171511; font-family:'Gothic A1',sans-serif; color:#fff; }
  body{ padding:60px 24px 100px; }
  .han{ font-family:'Black Han Sans',sans-serif; } .mono{ font-family:'IBM Plex Mono',monospace; }
  .seg7{ font-family:'DSEG7-Classic','IBM Plex Mono',monospace; }

  .page-title{ text-align:center; color:rgba(255,255,255,0.4); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:4px; margin-bottom:50px; }
  .row{ display:flex; gap:50px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  .screen-wrap{ display:flex; flex-direction:column; align-items:center; }
  .label{ margin-top:16px; color:rgba(255,255,255,0.55); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; text-align:center; line-height:1.6; }

  .phone{ width:340px; height:710px; background:#000; border-radius:50px; padding:11px; position:relative; box-shadow:0 30px 80px rgba(0,0,0,0.7); }
  .screen{ width:100%; height:100%; border-radius:40px; overflow:hidden; position:relative; background:linear-gradient(150deg,#cbe6f3 0%,#a6cee4 50%,#bcdded 100%); }
  .island{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:100px; height:30px; background:#000; border-radius:18px; z-index:200; }

  .pouch{ position:absolute; inset:0; z-index:1; pointer-events:none; border-radius:40px; overflow:hidden; }
  .pouch::before{ content:""; position:absolute; bottom:-40px; left:-30px; width:220px; height:200px; background:radial-gradient(circle, rgba(255,255,255,0.85), rgba(255,255,255,0.1) 55%, transparent 70%); filter:blur(6px); }
  .pouch::after{ content:""; position:absolute; top:60px; right:-30px; width:140px; height:240px; background:radial-gradient(circle, rgba(255,255,255,0.5), transparent 65%); filter:blur(8px); }

  .tj{ position:absolute; inset:10px; top:9px; z-index:5; border-radius:30px; padding:38px 12px 12px;
    background:linear-gradient(150deg,#f1ead7 0%,#e4dabe 45%,#d2c7a6 80%,#c2b692 100%);
    box-shadow:0 3px 14px rgba(20,50,80,0.3), inset 0 1px 0 rgba(255,255,255,0.5); }
  .deck{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; gap:8px; }

  .head{ display:flex; align-items:center; padding:0 4px; }
  .brand{ display:flex; align-items:center; gap:6px; }
  .brand .badge{ width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ff8a5c,#e8533a); display:flex; align-items:center; justify-content:center; font-family:'Black Han Sans'; font-size:12px; color:#fff; }
  .brand .nm{ font-family:'Black Han Sans'; font-size:18px; color:#333; }

  /* ===== 7세그먼트 LED 디스플레이 (시간만, 가운데) ===== */
  /* VFD 디스플레이 — 빨강 7세그 + 양옆 초록 막대 (금영 vivous 풍) */
  .lcd{ position:relative; overflow:hidden; background:radial-gradient(120% 110% at 50% 40%, #14120b, #050503); border:2px solid #2c281c; border-radius:7px; padding:11px 12px; box-shadow:inset 0 2px 12px rgba(0,0,0,0.9); }
  .vfd{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .vfd .col{ display:flex; flex-direction:column; gap:3px; }
  .vfd .blk{ width:12px; height:5px; border-radius:1px; background:rgba(93,255,143,0.16); }
  .vfd .blk.g{ background:#4ee87f; box-shadow:0 0 5px rgba(78,232,127,0.85); }
  .vfd .blk.r{ background:#ff4d3a; box-shadow:0 0 6px rgba(255,77,58,0.9); }
  .vfd .center{ position:relative; text-align:center; flex:1; }
  .vfd .digits{ position:relative; display:inline-block; line-height:1; }
  .vfd .ghost{ position:absolute; left:0; top:0; font-family:'DSEG7-Classic'; font-weight:bold; font-size:51px; color:rgba(255,100,60,0.10); letter-spacing:2px; }
  .vfd .val{ position:relative; font-family:'DSEG7-Classic'; font-weight:bold; font-size:51px; color:#ff5a32; letter-spacing:2px; text-shadow:0 0 9px rgba(255,90,50,0.9), 0 0 20px rgba(255,90,50,0.45); }
  .vfd .val .cln{ animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0.2; } }
  .lcd::after{ content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(160deg, rgba(255,255,255,0.08), transparent 42%); }

  .panel{ background:linear-gradient(180deg,#54545c,#3a3a40); border-radius:11px; padding:9px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.1); }
  .prow{ display:flex; gap:6px; } .prow + .prow{ margin-top:6px; }

  .fb{ flex:1; text-align:center; padding:7px 2px; border-radius:7px; font-family:'Gothic A1'; font-weight:900; font-size:15px; line-height:1.1; border:1px solid rgba(0,0,0,0.25); }
  .fb .ar{ font-size:11px; opacity:0.85; }
  .fb.nv{ background:linear-gradient(180deg,#e6e6de,#cfcfc4); color:#222; box-shadow:0 2px 0 #a9a99e; border-color:#b4b4a8; }   /* 회색 기능버튼 */
  .fb.nv .ar{ opacity:0.7; }
  .fb.lt{ background:linear-gradient(180deg,#f2ecda,#e2d9c1); color:#222; box-shadow:0 2px 0 #bcb091; border-color:#c9bd9d; }
  .fb.gr{ background:linear-gradient(180deg,#74c94f,#54a836); color:#0b2606; box-shadow:0 2px 0 #3a7720; border-color:#3a7720; }
  .fb.on{ outline:2px solid #3f73bd; outline-offset:1px; }
  .fb.on .dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--orange); margin-right:3px; vertical-align:middle; }
  .fb.add{ flex:0 0 32px; font-size:17px; color:var(--navytx); }

  /* 모드별 앱 관리 — 가로로 긴 빨간 버튼 */
  .manage{ height:42px; border-radius:10px; background:linear-gradient(180deg,#ec5743,#d23522); color:#fff; border:1px solid #a8281a; box-shadow:0 3px 0 #951f12; display:flex; align-items:center; justify-content:center; gap:7px; font-family:'Gothic A1'; font-weight:900; font-size:17px; letter-spacing:0.3px; }

  /* 아이보리 야광 숫자키 */
  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  /* 옅은 회색 키 + 크고 굵은 이탤릭 검정 숫자 (프린트 느낌) */
  /* 옅은 회색 키 + 큼직하게 꽉 찬 이탤릭 검정 숫자 */
  .nkey{ height:50px; border-radius:9px; background:linear-gradient(180deg,#eceee0,#d6d9c4); color:#1a1a1a; border:1px solid #c1c4b0; box-shadow:0 3px 0 #b1b49f, inset 0 1px 0 #ffffff, 0 0 8px rgba(196,228,150,0.28); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2','Gothic A1',sans-serif; font-weight:800; font-style:italic; font-size:44px; line-height:1; }
  /* CANCEL·BACK 둘 다 파랑, 꽉 차게 */
  .nkey.cancel,.nkey.del{ background:linear-gradient(180deg,#5a93d6,#3f73bd); color:#fff; border-color:#2f5a9a; box-shadow:0 3px 0 #294f88; font-family:'Baloo 2','Gothic A1',sans-serif; font-style:normal; font-weight:800; }
  .nkey.cancel{ font-size:18px; letter-spacing:-0.5px; }
  .nkey.del{ font-size:21px; letter-spacing:-0.5px; }

  /* 하단: 점프(독립) + 시작 */
  .bottom{ margin-top:auto; display:flex; gap:8px; }
  /* 시작 = 네온 노랑, 둥글게(알약), 크게 단독 */
  .reserve{ flex:1; height:64px; border-radius:32px; background:linear-gradient(180deg,#f7ff5e,#e9f600); color:#2a2e06; border:1px solid #c8d400;
    box-shadow:0 4px 0 #b5bf00, 0 0 30px rgba(225,255,20,0.7); display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans'; font-size:33px; letter-spacing:12px; text-shadow:0 1px 0 rgba(255,255,255,0.4); }

  /* 비닐 막 */
  .film{ position:absolute; inset:0; z-index:80; pointer-events:none; border-radius:40px; overflow:hidden; }
  .film .tint{ position:absolute; inset:0; background:rgba(150,195,225,0.10); }
  .film .topglow{ position:absolute; inset:0; background:radial-gradient(70% 26% at 38% 8%, rgba(255,255,255,0.12), transparent 60%); }
  .film .warp{ position:absolute; left:0; right:0; top:52%; height:40%; }
  .film .warp .st{ position:absolute; background:linear-gradient(100deg, transparent, rgba(255,255,255,0.62), transparent); filter:blur(1.2px); border-radius:6px; }
  .film .warp .s1{ left:-10%; right:26%; top:4%;  height:13px; transform:rotate(-9deg) skewX(-24deg); opacity:0.95; }
  .film .warp .s2{ left:12%; right:-10%; top:28%; height:17px; transform:rotate(7deg)  skewX(28deg);  opacity:0.82; }
  .film .warp .s3{ left:-6%; right:40%; top:56%; height:10px; transform:rotate(-5deg) skewX(-16deg); opacity:0.7; }
  .film .warp .s4{ left:32%; right:3%;  top:74%; height:11px; transform:rotate(10deg) skewX(20deg);  opacity:0.6; }
  .film .warp .bl{ position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,0.42), transparent 65%); filter:blur(5px); }
  .film .warp .bl1{ width:130px; height:62px; left:8%;  top:6%;  transform:rotate(18deg); }
  .film .warp .bl2{ width:96px;  height:52px; right:5%; top:44%; transform:rotate(-16deg); }
  .film .edge{ position:absolute; inset:4px; border-radius:36px; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.4), inset 0 0 22px rgba(180,215,235,0.25); }
  .film .seam{ position:absolute; top:38px; left:50%; transform:translateX(-50%); width:130px; height:12px; background:rgba(255,255,255,0.22); filter:blur(3px); border-radius:8px; }
</style>
</head>
<body>

<div class="page-title">화면 1 — 리모컨 · 7세그 LED + 점프 투두</div>

<div class="row">

  <div class="screen-wrap">
    <div class="phone"><div class="screen">
      <div class="island"></div>
      <div class="pouch"></div>

      <div class="tj">
        <div class="deck">

          <div class="head">
            <div class="brand"><div class="badge">TL</div><div class="nm">TODOLOCK</div></div>
          </div>

          <!-- 7세그먼트 LED: 시간만 가운데 -->
          <div class="lcd">
            <div class="vfd">
              <div class="col">
                <span class="blk r"></span><span class="blk g"></span><span class="blk g"></span><span class="blk"></span><span class="blk g"></span><span class="blk"></span>
              </div>
              <div class="center">
                <div class="digits">
                  <span class="ghost">88:88</span>
                  <span class="val seg7">03<span class="cln">:</span>00</span>
                </div>
              </div>
              <div class="col">
                <span class="blk r"></span><span class="blk g"></span><span class="blk"></span><span class="blk g"></span><span class="blk g"></span><span class="blk"></span>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="prow">
              <div class="fb nv">시간 <span class="ar">▲</span></div>
              <div class="fb nv">시간 <span class="ar">▼</span></div>
              <div class="fb gr">점프</div>
            </div>
            <!-- 세션 프리셋 3개 고정 (각 프리셋: 타이틀·시간·앱 저장) -->
            <div class="prow">
              <div class="fb lt on"><span class="dot"></span>공부모드</div>
              <div class="fb lt">출근길</div>
              <div class="fb lt">잘때</div>
            </div>
          </div>

          <!-- 선택된 모드(공부모드)의 앱 관리 -->
          <div class="manage">잠글 앱 관리</div>

          <div class="pad">
            <div class="nkey">1</div><div class="nkey">2</div><div class="nkey">3</div>
            <div class="nkey">4</div><div class="nkey">5</div><div class="nkey">6</div>
            <div class="nkey">7</div><div class="nkey">8</div><div class="nkey">9</div>
            <div class="nkey cancel">CANCEL</div><div class="nkey">0</div><div class="nkey del">BACK</div>
          </div>

          <!-- 시작 (크게 단독) -->
          <div class="bottom">
            <div class="reserve">시 작 ▶</div>
          </div>

        </div>
      </div>

      <div class="film">
        <div class="tint"></div>
        <div class="topglow"></div>
        <div class="warp">
          <span class="bl bl1"></span><span class="bl bl2"></span>
          <span class="st s1"></span><span class="st s2"></span><span class="st s3"></span><span class="st s4"></span>
        </div>
        <div class="seam"></div>
        <div class="edge"></div>
      </div>

    </div></div>
    <div class="label">점프(초록)=컨트롤 줄로 · 모드관리 삭제<br>시작(파랑) 크게 단독 · 취소/지움 파랑 · 숫자 Baloo</div>
  </div>

</div>

</body>
</html>
